    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f0f;
            color: #f3f4f6;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { 
            color: #a970ff; 
            font-weight: 700;
            font-size: 2.5rem;
            margin-bottom: 40px;
            letter-spacing: -0.04em;
            text-align: center;
        }
        .container {
            max-width: 1100px;
            width: 100%;
        }
        .tier-section {
            margin-bottom: 60px;
        }
        .tier-title {
            font-size: 0.875rem;
            font-weight: 700;
            border-bottom: 1px solid #222;
            padding-bottom: 12px;
            margin-bottom: 24px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .streamer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }
        .streamer-card {
            background-color: #161616;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #222;
            text-decoration: none;
            color: inherit;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .streamer-card:hover {
            transform: translateY(-6px);
            border-color: #a970ff;
            background-color: #1c1c1c;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .stream-thumbnail {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid #222;
        }
        .streamer-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .user-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #222;
            border: 2px solid #333;
        }
        .username {
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
        }
        .stream-title {
            font-size: 0.9375rem;
            color: #9ca3af;
            line-height: 1.5;
            word-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .user-tagline {
            font-size: 0.8125rem;
            color: #6b7280;
            font-style: italic;
            margin-top: 4px;
        }
        .status-box {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 800;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .live { 
            background-color: #ff4b4b; 
            box-shadow: 0 0 12px #ff4b4b; 
            animation: pulse 2s infinite;
        }
        .offline { background-color: #4b5563; }
        .status-label {
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .site-footer {
            margin-top: 80px;
            padding: 40px 20px;
            border-top: 1px solid #222;
            width: 100%;
            text-align: center;
            color: #6b7280;
            font-size: 0.875rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        .header {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .nav-top {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 20px;
        }
        .nav-link {
            color: #9ca3af;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            color: #a970ff;
        }
        .nav-link.highlight {
            color: #a970ff;
            background: rgba(169, 112, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(169, 112, 255, 0.3);
        }
        .nav-link.highlight:hover {
            background: rgba(169, 112, 255, 0.2);
            border-color: #a970ff;
        }
        .footer-credits {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            align-items: center;
        }
        .footer-link {
            color: #a970ff;
            text-decoration: none;
            transition: color 0.2s ease;
            font-weight: 600;
        }
        .footer-link:hover {
            color: #c49cff;
            text-decoration: underline;
        }
        .footer-system {
            font-size: 0.75rem;
            color: #4b5563;
            opacity: 0.8;
        }
        .join-section {
            margin-top: 80px;
            padding: 60px 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(169, 112, 255, 0.08) 0%, rgba(15, 15, 15, 0) 100%);
            border-radius: 32px;
            border: 1px solid #222;
        }
        .join-text {
            font-size: 1.25rem;
            color: #f3f4f6;
            margin-bottom: 24px;
            font-weight: 600;
        }
        .join-button {
            display: inline-block;
            background-color: #a970ff;
            color: #fff;
            padding: 14px 32px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(169, 112, 255, 0.4);
        }
        .join-button:hover {
            transform: scale(1.05);
            background-color: #b886ff;
            box-shadow: 0 12px 25px rgba(169, 112, 255, 0.5);
        }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 32px;
        }
        .detail-profile-pic {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 4px solid #a970ff;
            box-shadow: 0 0 20px rgba(169, 112, 255, 0.3);
        }
        .detail-username {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.03em;
        }
        .detail-status-label {
            font-size: 1.125rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .detail-status-label.live { color: #ff4b4b; }
        .detail-status-label.offline { color: #9ca3af; }
        .detail-thumbnail {
            width: 100%;
            border-radius: 20px;
            margin-bottom: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .detail-offline-placeholder {
            width: 100%;
            height: 360px;
            background: #161616;
            border: 2px dashed #333;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 1.375rem;
            margin-bottom: 32px;
        }
        .detail-body {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 48px;
        }
        .detail-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #f3f4f6;
            line-height: 1.3;
        }
        .detail-tagline {
            font-size: 1.25rem;
            color: #9ca3af;
            font-style: italic;
            line-height: 1.5;
        }
        .detail-watch-button {
            display: inline-block;
            width: and fit-content;
            background-color: #a970ff;
            color: #fff;
            padding: 18px 36px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 800;
            font-size: 1.25rem;
            transition: all 0.2s ease;
            box-shadow: 0 8px 20px rgba(169, 112, 255, 0.4);
        }
        .detail-watch-button:hover {
            transform: scale(1.05);
            background-color: #b886ff;
            box-shadow: 0 12px 25px rgba(169, 112, 255, 0.5);
        }
        .detail-footer {
            margin-top: 48px;
            border-top: 1px solid #222;
            padding-top: 24px;
        }
        .detail-back-link {
            color: #a970ff;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.2s ease;
        }
        .detail-back-link:hover {
            color: #c49cff;
            text-decoration: underline;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>

    <script>
        document.addEventListener('click', function(e) {
            const target = e.target.closest('a');
            if (!target) return;

            // Track Streamer Card clicks (Main Grid)
            if (target.classList.contains('streamer-card')) {
                const username = target.getAttribute('href').split('/').pop();
                if (username && window.umami) {
                    window.umami.track('Streamer Click', { name: username });
                }
            } 
            // Track "Watch on Twitch" clicks (Detail Page)
            else if (target.classList.contains('detail-watch-button')) {
                const username = window.location.pathname.split('/').pop();
                if (username && window.umami) {
                    window.umami.track('Watch Click', { name: username });
                }
            }
            // Track Join Button clicks
            else if (target.classList.contains('join-button')) {
                if (window.umami) {
                    window.umami.track('Join Click');
                }
            }
        });
    </script>
</body>
