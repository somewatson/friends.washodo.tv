<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamer Status</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #eee;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #a970ff; }
        .container {
            max-width: 900px;
            width: 100%;
        }
        .tier-section {
            margin-bottom: 30px;
        }
        .tier-title {
            font-size: 1.5rem;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #ddd;
        }
        .streamer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .streamer-card {
            background-color: #2a2a2a;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            border: 1px solid #444;
            text-decoration: none;
            color: inherit;
            position: relative;
        }
        .streamer-card:hover {
            transform: translateY(-3px);
            border-color: #a970ff;
            background-color: #333;
        }
        .stream-thumbnail {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-bottom: 1px solid #444;
        }
        .streamer-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .user-meta {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-pic {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #444;
        }
        .username {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .stream-title {
            font-size: 0.85rem;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .status-box {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .live { background-color: #ff4b4b; box-shadow: 0 0 8px #ff4b4b; }
        .offline { background-color: #555; }
        .status-label {
            color: #eee;
        }
    </style>
</head>
<body>
    <h1>Streamer Status</h1>
    <div class="container">
        <!-- CONTENT_PLACEHOLDER -->
    </div>
</body>
</html>
