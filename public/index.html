<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { 
            color: #a970ff; 
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.02em;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        .tier-section {
            margin-bottom: 40px;
        }
        .tier-title {
            font-size: 1.25rem;
            font-weight: 600;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 20px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .streamer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .streamer-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
            border: 1px solid #333;
            text-decoration: none;
            color: inherit;
            position: relative;
        }
        .streamer-card:hover {
            transform: translateY(-4px);
            border-color: #a970ff;
            background-color: #252525;
        }
        .stream-thumbnail {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid #333;
        }
        .streamer-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .user-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .profile-pic {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #333;
            border: 1px solid #444;
        }
        .username {
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
        }
        .stream-title {
            font-size: 0.875rem;
            color: #9ca3af;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-tagline {
            font-size: 0.75rem;
            color: #6b7280;
            font-style: italic;
            margin-top: 4px;
        }
        .status-box {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            font-size: 0.7rem;
            font-weight: 700;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .live { 
            background-color: #ff4b4b; 
            box-shadow: 0 0 10px #ff4b4b; 
            animation: pulse 2s infinite;
        }
        .offline { background-color: #555; }
        .status-label {
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .site-footer {
            margin-top: 60px;
            padding: 30px 20px;
            border-top: 1px solid #333;
            width: 100%;
            text-align: center;
            color: #9ca3af;
            font-size: 0.875rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .nav-top {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 20px;
        }
        .nav-link {
            color: #9ca3af;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }
        .nav-link:hover {
            color: #a970ff;
        }
        .nav-link.highlight {
            color: #a970ff;
            background: rgba(169, 112, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(169, 112, 255, 0.3);
        }
        .nav-link.highlight:hover {
            background: rgba(169, 112, 255, 0.2);
            border-color: #a970ff;
        }
        .signup-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #444;
        }
        .modal-content h2 { color: #a970ff; margin-top: 0; }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1a1a1a;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .modal-content button {
            width: 100%;
            padding: 12px;
            background: #a970ff;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .modal-content .close-btn {
            background: transparent;
            color: #888;
            border: 1px solid #444;
            margin-top: 5px;
        }
        .footer-credits {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            align-items: center;
        }
        .footer-link {
            color: #a970ff;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .footer-link:hover {
            color: #c49cff;
            text-decoration: underline;
        }
        .footer-system {
            font-size: 0.75rem;
            color: #6b7280;
            opacity: 0.8;
        }
        .join-section {
            margin-top: 60px;
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(169, 112, 255, 0.05) 0%, rgba(18, 18, 18, 0) 100%);
            border-radius: 24px;
            border: 1px solid #333;
        }
        .join-text {
            font-size: 1.1rem;
            color: #f3f4f6;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .join-button {
            display: inline-block;
            background-color: #a970ff;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 15px rgba(169, 112, 255, 0.3);
        }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .detail-profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #a970ff;
        }
        .detail-username {
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
        }
        .detail-status-label {
            font-size: 1rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .detail-status-label.live { color: #ff4b4b; }
        .detail-status-label.offline { color: #9ca3af; }
        .detail-thumbnail {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .detail-offline-placeholder {
            width: 100%;
            height: 300px;
            background: #1e1e1e;
            border: 2px dashed #333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .detail-body {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }
        .detail-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #f3f4f6;
        }
        .detail-tagline {
            font-size: 1.1rem;
            color: #9ca3af;
            font-style: italic;
        }
        .detail-watch-button {
            display: inline-block;
            width: fit-content;
            background-color: #a970ff;
            color: #fff;
            padding: 15px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 15px rgba(169, 112, 255, 0.3);
        }
        .detail-watch-button:hover {
            transform: scale(1.05);
            background-color: #c49cff;
        }
        .detail-footer {
            margin-top: 40px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        .detail-back-link {
            color: #a970ff;
            text-decoration: none;
            font-weight: 600;
        }
        .detail-back-link:hover {
            text-decoration: underline;
        }
        @keyframes pulse {

            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body style="position: relative;">
    <div class="nav-top">
        <a href="/pricing" class="nav-link">Pricing</a>
        <a href="/discord-setup" class="nav-link highlight">🤖 Add Bot to Discord</a>
    </div>
    <h1>Streamer Status</h1>
    <div class="container">
        <!-- CONTENT_PLACEHOLDER -->
    </div>
    <div class="join-section">
        <div class="join-text">Want to be included here?</div>
        <button onclick="openSignupModal()" class="join-button" style="cursor: pointer; border: none; font-family: inherit;">Sign Up Now</button>
    </div>
    <div id="signupModal" class="signup-modal">
        <div class="modal-content">
            <h2>Join the Community</h2>
            <p style="color: #ccc; font-size: 0.9rem; margin-bottom: 20px;">Sign up to get your stream tracked and notified!</p>
            <form id="signupForm">
                <input type="text" id="full_name" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email Address" required>
                <select id="selected_plan" required>
                    <option value="" disabled selected>Select a Plan</option>
                    <option value="Free">Free (Ad-supported)</option>
                    <option value="Basic">Basic ($8/mo, Ad-free)</option>
                    <option value="Professional">Professional (Custom Domain)</option>
                </select>
                <button type="submit" id="signupSubmit">Complete Signup</button>
                <button type="button" class="close-btn" onclick="closeSignupModal()">Cancel</button>
            </form>
        </div>
    </div>
    <footer class="site-footer">
        <div class="footer-system">Real-time data provided by Twitch API</div>
        <div class="footer-credits">
            <span>© 2026 Crafted by <a href="https://somewatson.com" target="_blank" class="footer-link">Some Watson</a></span>
            <span>•</span>
            <span>Helping build the <a href="https://washodo.tv" target="_blank" class="footer-link">Washodo</a> community</span>
            <span>•</span>
            <a href="https://github.com/SomeWatson/friends.washodo.tv" target="_blank" class="footer-link">Source Code</a>
        </div>
    </footer>
    <script>
        function openSignupModal() {
            document.getElementById('signupModal').style.display = 'flex';
        }

        function closeSignupModal() {
            document.getElementById('signupModal').style.display = 'none';
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('signupSubmit');
            const originalText = submitBtn.innerText;
            
            const data = {
                full_name: document.getElementById('full_name').value,
                email: document.getElementById('email').value,
                selected_plan: document.getElementById('selected_plan').value
            };

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = 'Sending...';
                
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const result = await response.json();
                    alert(result.message);
                    closeSignupModal();
                    document.getElementById('signupForm').reset();
                } else {
                    const err = await response.json();
                    alert('Error: ' + (err.error || 'Something went wrong'));
                }
            } catch (error) {
                alert('Network error. Please try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = originalText;
            }
        });

        document.addEventListener('click', function(e) {
            const target = e.target.closest('a');
            if (!target) return;


            // Track Streamer Card clicks (Main Grid)
            if (target.classList.contains('streamer-card')) {
                const username = target.getAttribute('href').split('/').pop();
                if (username && window.umami) {
                    window.umami.track('Streamer Click', { name: username });
                }
            } 
            // Track "Watch on Twitch" clicks (Detail Page)
            else if (target.classList.contains('detail-watch-button')) {
                const username = window.location.pathname.split('/').pop();
                if (username && window.umami) {
                    window.umami.track('Watch Click', { name: username });
                }
            }
            // Track Join Button clicks
            else if (target.classList.contains('join-button')) {
                if (window.umami) {
                    window.umami.track('Join Click');
                }
            }
        });
    </script>
</body>
</html>
