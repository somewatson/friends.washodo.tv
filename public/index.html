<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Washodo Stream Status | Who's Live?</title>
    <meta name="description" content="Track the live status of your favorite Washodo community streamers in one place. See who's live and jump straight into the action.">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://friends.washodo.tv/">
    <meta property="og:title" content="Washodo Stream Status | Who's Live?">
    <meta property="og:description" content="Track the live status of your favorite Washodo community streamers in one place.">
    <meta property="og:image" content="https://washodo.tv/public/images/washodo-circle-logo.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://friends.washodo.tv/">
    <meta property="twitter:title" content="Washodo Stream Status | Who's Live?">
    <meta property="twitter:description" content="Track the live status of your favorite Washodo community streamers in one place.">
    <meta property="twitter:image" content="https://washodo.tv/public/images/washodo-circle-logo.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { 
            color: #a970ff; 
            font-weight: 700;
            margin-bottom: 30px;
            letter-spacing: -0.02em;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        .tier-section {
            margin-bottom: 40px;
        }
        .tier-title {
            font-size: 1.25rem;
            font-weight: 600;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 20px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .streamer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .streamer-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
            border: 1px solid #333;
            text-decoration: none;
            color: inherit;
            position: relative;
        }
        .streamer-card:hover {
            transform: translateY(-4px);
            border-color: #a970ff;
            background-color: #252525;
        }
        .stream-thumbnail {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid #333;
        }
        .streamer-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .user-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .profile-pic {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #333;
            border: 1px solid #444;
        }
        .username {
            font-weight: 600;
            font-size: 1.1rem;
            color: #fff;
        }
        .stream-title {
            font-size: 0.875rem;
            color: #9ca3af;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user-tagline {
            font-size: 0.75rem;
            color: #6b7280;
            font-style: italic;
            margin-top: 4px;
        }
        .status-box {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            padding: 4px 10px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            font-size: 0.7rem;
            font-weight: 700;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .status-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .live { 
            background-color: #ff4b4b; 
            box-shadow: 0 0 10px #ff4b4b; 
            animation: pulse 2s infinite;
        }
        .offline { background-color: #555; }
        .status-label {
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .site-footer {
            margin-top: 60px;
            padding: 30px 20px;
            border-top: 1px solid #333;
            width: 100%;
            text-align: center;
            color: #9ca3af;
            font-size: 0.875rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .footer-credits {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            align-items: center;
        }
        .footer-link {
            color: #a970ff;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .footer-link:hover {
            color: #c49cff;
            text-decoration: underline;
        }
        .footer-system {
            font-size: 0.75rem;
            color: #6b7280;
            opacity: 0.8;
        }
        @keyframes pulse {

            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <h1>Streamer Status</h1>
    <div class="container">
        <!-- CONTENT_PLACEHOLDER -->
    </div>
    <footer class="site-footer">
        <div class="footer-system">Real-time data provided by Twitch API</div>
        <div class="footer-credits">
            <span>© 2026 Crafted by <a href="https://somewatson.com" target="_blank" class="footer-link">Some Watson</a></span>
            <span>•</span>
            <span>Helping build the <a href="https://washodo.tv" target="_blank" class="footer-link">Washodo</a> community</span>
            <span>•</span>
            <a href="https://github.com/SomeWatson/friends.washodo.tv" target="_blank" class="footer-link">Source Code</a>
        </div>
    </footer>
</body>
</html>
