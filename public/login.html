<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warden Gate - Authorization</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #a970ff;
            --secondary-color: #38bdf8;
            --error-color: #ef4444;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #333;
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 10px;
            display: block;
        }
        h1 {
            color: var(--accent-color);
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        p {
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #bbb;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #444;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
        }
        .btn-login:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        #error-msg {
            color: var(--error-color);
            margin-top: 20px;
            font-size: 0.85rem;
            min-height: 1.2em;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .visible { opacity: 1 !important; }
    </style>
</head>
<body>
    <div class="login-card">
        <span class="logo">📯</span>
        <h1>Warden Gate</h1>
        <p>Identity verification required for access.</p>
        
        <form id="login-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Authorize Access</button>
        </form>
        <div id="error-msg">Invalid credentials. Access denied.</div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');

        form.onsubmit = async (e) => {
            e.preventDefault();
            errorMsg.classList.remove('visible');
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    window.location.href = '/warden-access';
                } else {
                    errorMsg.classList.add('visible');
                }
            } catch (err) {
                errorMsg.classList.add('visible');
            }
        };
    </script>
</body>
</html>
