<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <script defer src="https://beancounter.somewatson.com/script.js" data-website-id="cf5643bb-9645-4789-b5fd-a03e9944cf75"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #121212; 
            color: #f3f4f6; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        .nav-top { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            display: flex; 
            gap: 20px; 
            z-index: 100;
        }
        .nav-link { 
            color: #9ca3af; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 0.9rem; 
            transition: color 0.2s ease; 
        }
        .nav-link:hover { color: #a970ff; }
        .nav-link.highlight { 
            color: #a970ff; 
            background: rgba(169, 112, 255, 0.1); 
            padding: 6px 12px; 
            border-radius: 20px; 
            border: 1px solid rgba(169, 112, 255, 0.3); 
        }
        .site-footer { 
            margin-top: auto;
            padding: 30px 20px; 
            border-top: 1px solid #333; 
            width: 100%; 
            text-align: center; 
            color: #9ca3af; 
            font-size: 0.875rem; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 8px; 
        }
        .footer-link { color: #a970ff; text-decoration: none; }
        .footer-link:hover { text-decoration: underline; }
        .footer-system { font-size: 0.75rem; color: #6b7280; opacity: 0.8; }
        .footer-credits { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 8px; 
            align-items: center; 
        }
    </style>
</head>
<body style="position: relative;">
    <div class="nav-top">
        <a href="/" class="nav-link">Home</a>
        <a href="/pricing" class="nav-link">Pricing</a>
        <a href="/discord-setup" class="nav-link highlight">🤖 Add Bot to Discord</a>
    </div>
    
    <div class="main-content">
        {{content}}
    </div>

    <footer class="site-footer">
        <div class="footer-system">Real-time data provided by Twitch API</div>
        <div class="footer-credits">
            <span>© 2026 Crafted by <a href="https://somewatson.com" target="_blank" class="footer-link">Some Watson</a></span>
            <span>•</span>
            <span>Helping build the <a href="https://washodo.tv" target="_blank" class="footer-link">Washodo</a> community</span>
            <span>•</span>
            <a href="https://github.com/SomeWatson/friends.washodo.tv" target="_blank" class="footer-link">Source Code</a>
        </div>
    </footer>
</body>
</html>
