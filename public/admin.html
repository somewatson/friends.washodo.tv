<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Washodo Ward Admin</title>
    <link rel="stylesheet" href="/admin.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1 id="sidebar-title">⚙️ Washodo Ward</h1>
            <button class="collapse-btn" onclick="toggleSidebar()" title="Toggle Sidebar">
                <span>◀</span>
            </button>
        </div>
        <div class="nav-menu">
            <a href="/warden/streamers" class="nav-item" id="nav-streamers"><span>👥</span> Streamers</a>
            <a href="/warden/discord" class="nav-item" id="nav-discord"><span>💬</span> Discord</a>
            <a href="/warden/mattermost" class="nav-item" id="nav-mattermost"><span>🏢</span> Mattermost</a>
            <a href="/warden/broadcasts" class="nav-item" id="nav-broadcasts"><span>📢</span> Broadcasts</a>
            <a href="/warden/system" class="nav-item" id="nav-system"><span>🛠️</span> System</a>
            <a href="/warden/logs" class="nav-item" id="nav-logs"><span>📜</span> Logs</a>
        </div>
        <div class="sidebar-footer">
            <a href="/" target="_blank" class="btn-home">🏠 Return Home</a>
        </div>
    </div>

    <div class="main-content">
        <div id="notification-toast"></div>
        
        <div class="container">
            <div class="page-header">
                <h2 id="page-title">Loading...</h2>
                <p id="page-desc"></p>
            </div>

            <div id="content-area">
                <!-- Content dynamically injected here -->
            </div>
        </div>
    </div>

    <!-- Announcement Edit Modal -->
    <div id="announcement-modal" class="modal">
        <div class="modal-content">
            <h3>Edit Announcement</h3>
            <div class="modal-grid">
                <div class="editor-container">
                    <textarea id="ann-text" style="width: 100%; height: 300px; background: #222; color: white; border: 1px solid #555; border-radius: 4px; padding: 10px; font-family: monospace;"></textarea>
                </div>
            </div>
            <div class="modal-form-section">
                <label><input type="checkbox" id="ann-active" checked> Active</label>
                <label><input type="checkbox" id="ann-discord" checked> Discord</label>
                <label><input type="checkbox" id="ann-mattermost" checked> Mattermost</label>
                <label><input type="checkbox" id="ann-twitch"> Twitch</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label>Start:</label>
                    <input type="date" id="ann-start">
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <label>End:</label>
                    <input type="date" id="ann-end">
                </div>
                <div class="cron-input-group">
                    <label style="white-space: nowrap;">Schedule (Cron):</label>
                    <input type="text" id="ann-cron" style="flex: 1; background: transparent; color: white; border: none; outline: none; font-family: monospace;" placeholder="0 12 * * *">
                    <div id="cron-preview" style="font-size: 0.8em; min-width: 150px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></div>
                </div>
                <div class="cron-presets">
                    <button class="btn-preset" onclick="applyCronPreset('hourly')">Hourly</button>
                    <button class="btn-preset" onclick="applyCronPreset('daily_noon')">Daily Noon</button>
                    <button class="btn-preset" onclick="applyCronPreset('daily_midnight')">Daily Midnight</button>
                    <button class="btn-preset" onclick="applyCronPreset('weekly_mon')">Weekly Mon</button>
                    <button class="btn-preset" onclick="applyCronPreset('every_6h')">Every 6h</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-danger" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" onclick="saveAnnouncement()">Save Announcement</button>
            </div>
        </div>
    </div>

    <div id="broadcast-preview-modal" class="modal">
        <div class="modal-content">
            <h3>📢 Broadcast Preview</h3>
            <div class="preview-modal-content" id="preview-targets-list">
                <!-- Targets injected here -->
            </div>
            <div class="modal-footer">
                <button class="btn-danger" onclick="closePreviewModal()">Close</button>
                <button class="btn-success" onclick="triggerBroadcastNow()">🚀 Confirm & Send All</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="/admin.js"></script>
</body>
</html>
